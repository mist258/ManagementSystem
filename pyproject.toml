[project]
name = "managementsystem"
version = "0.1.0"
description = ""
authors = [{ name = "mist258", email = "natalia.kolchuk@gmail.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.133.0,<0.134",
    "uvicorn[standart]>=0.41.0,<0.42",
    "pydantic[email]>=2.12.5,<3",
    "pydantic-settings>=2.13.1,<3",
    "sqlalchemy[asyncio]>=2.0.47,<3",
    "asyncpg>=0.31.0,<0.32",
    "alembic>=1.18.4,<2",
    "pyjwt[crypto]>=2.11.0,<3",
    "bcrypt>=5.0.0,<6",
    "python-multipart>=0.0.22,<0.0.23",
]

[dependency-groups]
dev = [
    "black>=26.1.0,<27",
    "pytest>=9.0.2,<10",
    "isort>=8.0.1,<9",
    "pytest-asyncio>=1.3.0,<2",
    "httpx>=0.28.1,<0.29",
    "pytest-cov>=7.0.0,<8",
]

[tool.uv]
package = false
default-groups = "all"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
